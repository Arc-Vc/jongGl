
name: Mlbb2

on:
  workflow_dispatch:
    inputs:
      heroes:
        description: "Hero folder names separated by spaces"
        required: true
        default: "Kadita"
        type: string

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      DEST_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Validate hero names
        env:
          HERO_INPUT: ${{ inputs.heroes }}
        run: |
          python - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          heroes = os.environ["HERO_INPUT"].split()

          if not heroes:
              sys.exit("Enter at least one hero name.")

          if len(heroes) != len(set(heroes)):
              sys.exit("Remove duplicate hero names.")

          for hero in heroes:
              if not re.fullmatch(r"[A-Za-z0-9.'-]+", hero):
                  sys.exit(f"Invalid hero folder name: {hero}")

          Path("/tmp/hero-list.txt").write_text(
              "\n".join(heroes) + "\n"
          )

          print("Selected:", ", ".join(heroes))
          PY

      - name: Fetch destination Git tree without checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git init destination
          git -C destination remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"

          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"

          git -C destination \
            -c http.extraheader="AUTHORIZATION: basic $AUTH" \
            fetch --depth=1 --filter=blob:none origin \
            "refs/heads/${DEST_BRANCH}:refs/remotes/origin/${DEST_BRANCH}"

          git -C destination symbolic-ref HEAD \
            "refs/heads/${DEST_BRANCH}"

          git -C destination update-ref \
            "refs/heads/${DEST_BRANCH}" \
            "refs/remotes/origin/${DEST_BRANCH}"

          git -C destination read-tree HEAD

          echo "Destination tree fetched without a working-tree checkout."

      - name: Get selected source folders
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            --filter=blob:none \
            --no-checkout \
            https://github.com/injctr/large.git \
            source-repo

          git -C source-repo sparse-checkout init --cone
          git -C source-repo sparse-checkout set \
            --stdin < /tmp/hero-list.txt
          git -C source-repo checkout

      - name: Check sizes and prepare files
        run: |
          python - <<'PY'
          import shutil
          import sys
          from pathlib import Path

          heroes = Path("/tmp/hero-list.txt").read_text().splitlines()
          source_root = Path("source-repo")
          max_file = 100 * 1024 * 1024
          max_batch = int(1.5 * 1024 * 1024 * 1024)

          found = []
          total = 0

          for hero in heroes:
              folder = source_root / hero

              if not folder.is_dir():
                  print("NOT FOUND:", hero)
                  continue

              found.append(hero)

              for path in folder.rglob("*"):
                  if path.is_symlink() or not path.is_file():
                      continue

                  size = path.stat().st_size
                  if size >= max_file:
                      print("SKIP oversized file:", path)
                  else:
                      total += size

          if not found:
              sys.exit("No matching hero folders were found.")

          print(f"Eligible batch: {total / (1024**3):.2f} GiB")

          if total > max_batch:
              sys.exit("Batch exceeds 1.5 GiB. Select fewer heroes.")

          for hero in found:
              source = source_root / hero
              destination = Path(hero)

              for path in source.rglob("*"):
                  if path.is_symlink():
                      continue

                  relative = path.relative_to(source)
                  target = destination / relative

                  if path.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                      continue

                  if not path.is_file():
                      continue

                  if path.stat().st_size >= max_file:
                      continue

                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(path, target)

              print("Prepared:", hero)
          PY

      - name: Add only selected files to Git
        run: |
          set -euo pipefail

          python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          repo = Path("destination").resolve()
          heroes = Path("/tmp/hero-list.txt").read_text().splitlines()
          files = []

          for hero in heroes:
              folder = Path(hero)

              if not folder.is_dir():
                  continue

              for path in folder.rglob("*"):
                  if path.is_symlink() or not path.is_file():
                      continue
                  if path.stat().st_size >= 100 * 1024 * 1024:
                      continue
                  files.append(path)

          if not files:
              sys.exit("No eligible files to add.")

          def git(*args):
              return subprocess.run(
                  ["git", "-C", str(repo), *map(str, args)],
                  check=True, capture_output=True, text=True
              ).stdout.strip()

          changed = 0

          for path in files:
              blob = git("hash-object", "-w", str(path.resolve()))
              relative = path.as_posix()

              result = subprocess.run(
                  ["git", "-C", str(repo), "update-index",
                   "--add", "--cacheinfo", f"100644,{blob},{relative}"],
                  capture_output=True, text=True
              )

              if result.returncode:
                  sys.exit(result.stderr)

              changed += 1

          print(f"Added or updated {changed} files in the Git index.")
          PY

      - name: Commit and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cd destination

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          TREE="$(git write-tree)"
          PARENT="$(git rev-parse HEAD)"

          if [ "$TREE" = "$(git rev-parse HEAD^{tree})" ]; then
            echo "No changes to commit."
            exit 0
          fi

          COMMIT="$(
            printf 'Copy selected MLBB hero folders\n' |
            GIT_AUTHOR_NAME="github-actions[bot]" \
            GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" \
            GIT_COMMITTER_NAME="github-actions[bot]" \
            GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" \
            git commit-tree "$TREE" -p "$PARENT"
          )"

          git update-ref "refs/heads/${DEST_BRANCH}" "$COMMIT"

          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"

          git \
            -c http.extraheader="AUTHORIZATION: basic $AUTH" \
            push origin "refs/heads/${DEST_BRANCH}:refs/heads/${DEST_BRANCH}"

          echo "Push completed."
