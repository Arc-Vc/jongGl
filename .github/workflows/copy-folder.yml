
name: Copy Hayabusa

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4

      - name: Download Hayabusa source folder
        run: |
          git clone \
            --depth 1 \
            --filter=blob:none \
            --no-checkout \
            https://github.com/injctr/large.git \
            source-repo

          git -C source-repo sparse-checkout init --cone
          git -C source-repo sparse-checkout set Hayabusa
          git -C source-repo checkout

      - name: Check size and copy files
        run: |
          python - <<'PY'
          import shutil
          import sys
          from pathlib import Path

          hero = "Hayabusa"
          source = Path("source-repo") / hero
          destination = Path(hero)

          max_file = 100 * 1024 * 1024
          max_batch = int(1.5 * 1024 * 1024 * 1024)

          if not source.is_dir():
              sys.exit("Hayabusa folder was not found.")

          total = 0

          for path in source.rglob("*"):
              if path.is_symlink():
                  continue

              if path.is_file():
                  size = path.stat().st_size

                  if size >= max_file:
                      print("Will skip oversized file:", path)
                  else:
                      total += size

          print(f"Eligible size: {total / (1024**3):.2f} GiB")

          if total > max_batch:
              sys.exit("Batch exceeds 1.5 GiB. Copy smaller subfolders.")

          def ignore_links(directory, names):
              return [
                  name for name in names
                  if (Path(directory) / name).is_symlink()
              ]

          shutil.copytree(
              source,
              destination,
              dirs_exist_ok=True,
              ignore=ignore_links
          )

          for path in destination.rglob("*"):
              if path.is_symlink() or not path.is_file():
                  continue

              if path.stat().st_size >= max_file:
                  print("Removing oversized file:", path)
                  path.unlink()

          print("Hayabusa copy prepared.")
          PY

      - name: Commit copied files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- Hayabusa

          if ! git diff --cached --quiet; then
            git commit -m "Copy Hayabusa folder"
            git push
          else
            echo "No changes to commit."
          fi
