
name: Copy Folder Recursively

on:
  workflow_dispatch:
    inputs:
      folder:
        description: "Source folder, e.g. Aamon or Aamon/Collector"
        required: true
        default: "Aamon/Collector"

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4

      - name: Validate folder and clone source
        env:
          FOLDER: ${{ inputs.folder }}
        run: |
          python - <<'PY'
          import os
          import sys

          folder = os.environ.get("FOLDER", "")

          if (
              not folder
              or folder.startswith("/")
              or folder.endswith("/")
              or "\\" in folder
              or any(part in ("", ".", "..")
                     for part in folder.split("/"))
          ):
              sys.exit("Invalid folder path.")

          print("Selected folder:", folder)
          PY

          git clone \
            --depth 1 \
            --filter=blob:none \
            --no-checkout \
            https://github.com/injctr/large.git \
            source-repo

          git -C source-repo sparse-checkout init --cone

          git -C source-repo sparse-checkout set "$FOLDER"

          git -C source-repo checkout

          if [ ! -d "source-repo/$FOLDER" ]; then
            echo "Source folder was not found."
            exit 1
          fi

      - name: Copy files and nested folders
        env:
          FOLDER: ${{ inputs.folder }}
        run: |
          python - <<'PY'
          import os
          import sys
          import shutil
          from pathlib import Path

          folder = Path(os.environ["FOLDER"])
          source = Path("source-repo") / folder
          destination = folder

          if not source.is_dir():
              sys.exit("Source directory does not exist.")

          files = []
          directories = []
          total_bytes = 0
          skipped_large = 0
          skipped_links = 0

          for path in source.rglob("*"):
              if path.is_symlink():
                  skipped_links += 1
                  print("SKIPPED symbolic link:", path)
                  continue

              if path.is_dir():
                  directories.append(path)
                  continue

              if not path.is_file():
                  continue

              size = path.stat().st_size

              if size >= 100_000_000:
                  skipped_large += 1
                  print("SKIPPED file >= 100 MB:", path)
                  continue

              files.append(path)
              total_bytes += size

          # Leave room below GitHub's per-push limit.
          if total_bytes > 1_500_000_000:
              sys.exit(
                  "Selected folder exceeds the 1.5 GB copy limit. "
                  "Choose a smaller subfolder."
              )

          destination.mkdir(parents=True, exist_ok=True)

          # Recreate all non-empty source directories.
          for path in directories:
              relative = path.relative_to(source)
              (destination / relative).mkdir(
                  parents=True, exist_ok=True
              )

          # Copy each eligible file and retain its relative path.
          copied = 0

          for path in files:
              relative = path.relative_to(source)
              target = destination / relative

              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(path, target)

              copied += 1
              print("COPIED:", target)

          print()
          print("Files copied:", copied)
          print("Files skipped for size:", skipped_large)
          print("Symbolic links skipped:", skipped_links)
          print("Total copied bytes:", total_bytes)
          PY

      - name: Commit copied files
        env:
          FOLDER: ${{ inputs.folder }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- "$FOLDER"

          if ! git diff --cached --quiet; then
            git commit -m "Copy selected folder recursively"
            git push
          else
            echo "No changes to commit."
          fi
