
name: Copy Skin ZIPs

on:
  workflow_dispatch:
    inputs:
      folder:
        description: "Source folder"
        required: true
        default: "Aamon/Collector"

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4

      - name: Download ZIP files
        env:
          FOLDER: ${{ inputs.folder }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import pathlib

          folder = os.environ["FOLDER"].strip("/")

          if ".." in folder.split("/"):
              raise SystemExit("Invalid folder path")

          api = (
              "https://api.github.com/repos/injctr/large/contents/"
              + folder + "?ref=main"
          )

          req = urllib.request.Request(
              api, headers={"User-Agent": "ARC-Skin-Copier"}
          )

          with urllib.request.urlopen(req) as response:
              items = json.load(response)

          if not isinstance(items, list):
              raise SystemExit("Folder not found. Check the path.")

          zips = [
              item for item in items
              if item["type"] == "file"
              and item["name"].lower().endswith(".zip")
          ]

          if not zips:
              raise SystemExit("No ZIP files found in this folder.")

          for item in zips:
              if item["size"] >= 100_000_000:
                  print("Skipped file over 100 MB:", item["name"])
                  continue

              destination = (
                  pathlib.Path("skins") / folder / item["name"]
              )
              destination.parent.mkdir(
                  parents=True, exist_ok=True
              )

              request = urllib.request.Request(
                  item["download_url"],
                  headers={"User-Agent": "ARC-Skin-Copier"}
              )

              with urllib.request.urlopen(request) as response:
                  destination.write_bytes(response.read())

              print("Downloaded:", destination)

          PY

      - name: Commit files to my repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skins/
          if ! git diff --cached --quiet; then
            git commit -m "Copy selected skin ZIPs"
            git push
          else
            echo "No new files to commit."
          fi
