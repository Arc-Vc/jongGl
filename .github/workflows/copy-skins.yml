
name: Copy Diggie and Dyrroth

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4

      - name: Download selected source folders
        run: |
          git clone \
            --depth 1 \
            --filter=blob:none \
            --no-checkout \
            https://github.com/injctr/large.git \
            source-repo

          git -C source-repo sparse-checkout init --cone

          git -C source-repo sparse-checkout set \
            Diggie Dyrroth

          git -C source-repo checkout

      - name: Check size and copy files
        run: |
          python - <<'PY'
          import shutil
          import sys
          from pathlib import Path

          heroes = ["Diggie", "Dyrroth"]
          source_root = Path("source-repo")
          max_file = 100 * 1024 * 1024
          max_batch = int(1.5 * 1024 * 1024 * 1024)

          found = []
          total = 0

          for hero in heroes:
              folder = source_root / hero

              if not folder.is_dir():
                  print("NOT FOUND:", hero)
                  continue

              found.append(hero)

              for path in folder.rglob("*"):
                  if path.is_symlink():
                      continue

                  if path.is_file():
                      size = path.stat().st_size
                      if size >= max_file:
                          print("SKIPPING oversized file:", path)
                      else:
                          total += size

          if not found:
              sys.exit("No selected folders were found.")

          print(f"Eligible batch size: {total / (1024**3):.2f} GiB")

          if total > max_batch:
              sys.exit("Batch exceeds 1.5 GiB. Copy fewer files per run.")

          for hero in found:
              source = source_root / hero
              destination = Path(hero)

              def ignore_links(directory, names):
                  return [
                      name for name in names
                      if (Path(directory) / name).is_symlink()
                  ]

              shutil.copytree(
                  source,
                  destination,
                  dirs_exist_ok=True,
                  ignore=ignore_links
              )

              for path in destination.rglob("*"):
                  if path.is_symlink() or not path.is_file():
                      continue

                  if path.stat().st_size >= max_file:
                      print("Removing oversized file:", path)
                      path.unlink()

              print("Copied:", hero)

          PY

      - name: Commit copied files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- Diggie Dyrroth

          if ! git diff --cached --quiet; then
            git commit -m "Copy Diggie and Dyrroth folders"
            git push
          else
            echo "No changes to commit."
          fi
