
name: Copy Selected MLBB Heroes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4

      - name: Clone selected hero folders
        run: |
          git clone \
            --depth 1 \
            --filter=blob:none \
            --no-checkout \
            https://github.com/injctr/large.git \
            source-repo

          git -C source-repo sparse-checkout init --cone

          git -C source-repo sparse-checkout set \
            Akai Aldous Alice Alpha Alucard

          git -C source-repo checkout

      - name: Copy all files and nested folders
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path

          heroes = [
              "Akai",
              "Aldous",
              "Alice",
              "Alpha",
              "Alucard",
          ]

          source_root = Path("source-repo")

          for hero in heroes:
              source = source_root / hero
              destination = Path(hero)

              if not source.is_dir():
                  print(f"NOT FOUND: {hero}")
                  continue

              shutil.copytree(
                  source,
                  destination,
                  dirs_exist_ok=True,
                  ignore=shutil.ignore_patterns(".git")
              )

              print(f"COPIED: {hero}")

          PY

      - name: Check repository size before commit
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          heroes = ["Akai", "Aldous", "Alice", "Alpha", "Alucard"]
          total = 0
          oversized = []

          for hero in heroes:
              folder = Path(hero)

              if not folder.exists():
                  continue

              for path in folder.rglob("*"):
                  if path.is_symlink() or not path.is_file():
                      continue

                  size = path.stat().st_size
                  total += size

                  if size >= 100_000_000:
                      oversized.append(str(path))

          if oversized:
              print("Files over GitHub's 100 MB limit:")
              for path in oversized:
                  print(path)
              sys.exit("Remove or separately host oversized files.")

          print(f"Total selected files: {total / 1e9:.2f} GB")

          if total > 1_500_000_000:
              sys.exit(
                  "Batch exceeds 1.5 GB. Copy fewer heroes per run."
              )
          PY

      - name: Commit copied heroes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- Akai Aldous Alice Alpha Alucard

          if ! git diff --cached --quiet; then
            git commit -m "Copy selected MLBB hero folders"
            git push
          else
            echo "No changes to commit."
          fi
