
name: Copy Chou in Batches

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4

      - name: Fetch Chou folder
        run: |
          git clone \
            --depth 1 \
            --filter=blob:none \
            --no-checkout \
            https://github.com/injctr/large.git \
            source-repo

          git -C source-repo sparse-checkout init --cone
          git -C source-repo sparse-checkout set Chou
          git -C source-repo checkout

      - name: Build small batches
        run: |
          python - <<'PY'
          import os
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          source = Path("source-repo/Chou")
          if not source.is_dir():
              sys.exit("Chou folder not found.")

          limit = 700 * 1024 * 1024
          max_file = 100 * 1024 * 1024
          files = []
          skipped = 0

          for path in sorted(source.rglob("*")):
              if path.is_symlink() or not path.is_file():
                  continue

              size = path.stat().st_size
              if size >= max_file:
                  print("SKIPPED oversized file:", path)
                  skipped += 1
                  continue

              files.append((path, size))

          batches = []
          current = []
          total = 0

          for path, size in files:
              if current and total + size > limit:
                  batches.append(current)
                  current = []
                  total = 0

              current.append((path, size))
              total += size

          if current:
              batches.append(current)

          print("Files eligible:", len(files))
          print("Files skipped:", skipped)
          print("Batches:", len(batches))

          # Store batch lists for the next workflow step.
          os.makedirs("batch-data", exist_ok=True)

          import json
          with open("batch-data/manifest.json", "w") as f:
              json.dump(
                  [[str(p.relative_to(source)), size]
                   for batch in batches
                   for p, size in batch],
                  f
              )

          with open("batch-data/count.txt", "w") as f:
              f.write(str(len(batches)))
          PY

      - name: Copy and push batches
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          source = Path("source-repo/Chou")
          destination = Path("Chou")
          manifest = json.loads(
              Path("batch-data/manifest.json").read_text()
          )

          limit = 700 * 1024 * 1024
          batch = []
          total = 0
          batches = []

          for relative, size in manifest:
              if batch and total + size > limit:
                  batches.append(batch)
                  batch = []
                  total = 0

              batch.append((relative, size))
              total += size

          if batch:
              batches.append(batch)

          if not batches:
              sys.exit("No eligible files to copy.")

          subprocess.run(
              ["git", "config", "user.name", "github-actions[bot]"],
              check=True
          )
          subprocess.run(
              ["git", "config", "user.email",
               "41898282+github-actions[bot]@users.noreply.github.com"],
              check=True
          )

          for number, items in enumerate(batches, start=1):
              print(f"Processing batch {number}/{len(batches)}")

              for relative, size in items:
                  src = source / relative
                  dst = destination / relative
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dst)

              subprocess.run(
                  ["git", "add", "-A", "--", "Chou/"],
                  check=True
              )

              result = subprocess.run(
                  ["git", "diff", "--cached", "--quiet"]
              )

              if result.returncode == 0:
                  print("No changes in this batch.")
                  continue

              subprocess.run(
                  ["git", "commit", "-m",
                   f"Copy Chou files batch {number}"],
                  check=True
              )
              subprocess.run(["git", "push"], check=True)

          print("Finished processing Chou batches.")
          PY
