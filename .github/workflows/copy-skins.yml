
name: Copy Chou STUN

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout my repository
        uses: actions/checkout@v4

      - name: Download STUN folder
        run: |
          git clone \
            --depth 1 \
            --filter=blob:none \
            --no-checkout \
            https://github.com/injctr/large.git \
            source-repo

          git -C source-repo sparse-checkout init --cone
          git -C source-repo sparse-checkout set "Chou/STUN"
          git -C source-repo checkout

      - name: Copy STUN into my repository
        run: |
          python - <<'PY'
          import shutil
          import sys
          from pathlib import Path

          source = Path("source-repo/Chou/STUN")
          destination = Path("Chou/STUN")

          if not source.is_dir():
              sys.exit("Source folder Chou/STUN was not found.")

          destination.mkdir(parents=True, exist_ok=True)

          shutil.copytree(
              source,
              destination,
              dirs_exist_ok=True,
              ignore=shutil.ignore_patterns(".git")
          )

          print("Copied Chou/STUN and its nested files.")
          PY

      - name: Check file sizes
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          folder = Path("Chou/STUN")
          total = 0
          limit = 100 * 1024 * 1024

          for path in folder.rglob("*"):
              if path.is_symlink() or not path.is_file():
                  continue

              size = path.stat().st_size
              total += size

              if size >= limit:
                  sys.exit(f"File exceeds 100 MiB: {path}")

          print(f"Total folder size: {total / (1024**3):.2f} GiB")

          if total > int(1.5 * 1024**3):
              sys.exit("Folder exceeds the 1.5 GiB safety limit.")
          PY

      - name: Commit and push files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- "Chou/STUN"

          if ! git diff --cached --quiet; then
            git commit -m "Copy Chou STUN folder"
            git push
          else
            echo "No new changes to commit."
          fi
