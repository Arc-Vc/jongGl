
name: Copy Chou KOF Folder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout my repository
        uses: actions/checkout@v4

      - name: Download Chou KOF from source
        run: |
          git clone \
            --depth 1 \
            --filter=blob:none \
            --no-checkout \
            https://github.com/injctr/large.git \
            source-repo

          git -C source-repo sparse-checkout init --cone

          git -C source-repo sparse-checkout set Chou/KOF

          git -C source-repo checkout

      - name: Copy KOF into existing Chou folder
        run: |
          python - <<'PY'
          import shutil
          import sys
          from pathlib import Path

          source = Path("source-repo/Chou/KOF")
          destination = Path("Chou/KOF")

          if not source.is_dir():
              sys.exit("Source folder Chou/KOF was not found.")

          destination.mkdir(parents=True, exist_ok=True)

          shutil.copytree(
              source,
              destination,
              dirs_exist_ok=True,
              ignore=shutil.ignore_patterns(".git")
          )

          print("Copied Chou/KOF and its nested files.")
          PY

      - name: Check file sizes
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          folder = Path("Chou/KOF")
          max_file = 100 * 1024 * 1024
          total = 0

          for path in folder.rglob("*"):
              if path.is_symlink() or not path.is_file():
                  continue

              size = path.stat().st_size
              total += size

              if size >= max_file:
                  sys.exit(
                      f"File exceeds GitHub's regular Git limit: {path}"
                  )

          print(f"KOF folder size: {total / (1024**3):.2f} GiB")

          if total > int(1.5 * 1024 * 1024 * 1024):
              sys.exit(
                  "KOF is over 1.5 GiB. Use a smaller batch or "
                  "external storage."
              )
          PY

      - name: Commit KOF files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- Chou/KOF

          if ! git diff --cached --quiet; then
            git commit -m "Copy Chou KOF folder"
            git push
          else
            echo "No new changes to commit."
          fi
