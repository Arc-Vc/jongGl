name: Mlbb

on:
  workflow_dispatch:
    inputs:
      heroes:
        description: "Hero folder names separated by commas"
        required: true
        default: "Alucard, Alpha"
        type: string

permissions:
  contents: write

# One copy job at a time, so two runs can't fight over the push.
concurrency:
  group: mlbb-copy
  cancel-in-progress: false

env:
  SOURCE_REPO: https://github.com/injctr/large.git
  MAX_FILE_BYTES: 104857600     # 100 MiB, GitHub's limit per file
  MAX_BATCH_BYTES: 1610612736   # 1.5 GiB per run

defaults:
  run:
    shell: bash

jobs:
  copy:
    runs-on: ubuntu-latest

    steps:
      # Only download .github, not every hero folder already in the repo.
      - name: Checkout destination repository (light)
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github
          filter: blob:none

      - name: Validate hero names
        env:
          HERO_INPUT: ${{ inputs.heroes }}
        run: |
          IFS=',' read -ra raw_heroes <<< "$HERO_INPUT"
          heroes=()

          for raw_hero in "${raw_heroes[@]}"; do
            hero="${raw_hero#"${raw_hero%%[![:space:]]*}"}"
            hero="${hero%"${hero##*[![:space:]]}"}"

            if [ -z "$hero" ]; then
              echo "::error::Enter valid hero names separated by commas."
              exit 1
            fi

            heroes+=("$hero")
          done

          if [ -n "$(printf '%s\n' "${heroes[@]}" | sort | uniq -d)" ]; then
            echo "::error::Remove duplicate hero names."
            exit 1
          fi

          # Allows spaces inside folder names while rejecting path separators.
          pattern="^[A-Za-z0-9][A-Za-z0-9 .'\\-]*$"

          for hero in "${heroes[@]}"; do
            if ! [[ "$hero" =~ $pattern ]]; then
              echo "::error::Invalid hero folder name: $hero"
              exit 1
            fi
          done

          printf '%s\n' "${heroes[@]}" > /tmp/hero-list.txt
          echo "Selected heroes: ${heroes[*]}"

      - name: Fetch and copy selected folders
        run: |
          mapfile -t heroes < /tmp/hero-list.txt

          # blobless + sparse clone: only the chosen folders get downloaded
          git clone --depth 1 --filter=blob:none --sparse "$SOURCE_REPO" source-repo
          git -C source-repo sparse-checkout set "${heroes[@]}"

          found=()
          total=0
          for hero in "${heroes[@]}"; do
            if [ ! -d "source-repo/$hero" ]; then
              echo "NOT FOUND: $hero"
              continue
            fi

            find "source-repo/$hero" -type f -size +"$((MAX_FILE_BYTES - 1))"c \
              -printf 'WILL SKIP oversized file: %p\n'

            read -r count size < <(find "source-repo/$hero" -type f \
              -size -"$MAX_FILE_BYTES"c -printf '%s\n' \
              | awk '{ c++; s += $1 } END { print c + 0, s + 0 }')

            if [ "$count" -eq 0 ]; then
              echo "NOTHING TO COPY: $hero"
              continue
            fi

            found+=("$hero")
            total=$((total + size))
          done

          if [ "${#found[@]}" -eq 0 ]; then
            echo "::error::No matching hero folders were found."
            exit 1
          fi

          echo "Eligible batch size: $((total / 1048576)) MiB"
          if [ "$total" -gt "$MAX_BATCH_BYTES" ]; then
            echo "::error::Batch exceeds 1.5 GiB. Select fewer heroes."
            exit 1
          fi

          printf '%s\n' "${found[@]}" > /tmp/found-list.txt

          # A tar pipe copies files in batches; -type f skips symlinks.
          for hero in "${found[@]}"; do
            (cd source-repo && find "$hero" -type f -size -"$MAX_FILE_BYTES"c -print0 \
              | tar --null -T - -cf -) | tar -xf -
            echo "Finished: $hero"
          done

      - name: Commit copied files
        run: |
          mapfile -t heroes < /tmp/found-list.txt

          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"

          git config core.compression 0
          git config pack.compression 0
          git config pack.window 0

          git add --sparse -A -- "${heroes[@]}"

          if ! git diff --cached --quiet; then
            git commit -m "Copy selected MLBB hero folders"
            git push
          else
            echo "No changes to commit."
          fi
