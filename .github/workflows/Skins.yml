name: Generate Organized ZIP Catalog

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# If you push again while it's running, cancel the old run
concurrency:
  group: zip-catalog
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Fast checkout: no ZIP contents are downloaded, only the file tree
      - name: Checkout (tree only)
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: zip-links.txt
          sparse-checkout-cone-mode: false

      - name: Build organized ZIP catalog
        env:
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          python3 <<'PY'
          import os
          import subprocess
          from pathlib import PurePosixPath
          from urllib.parse import quote

          repository = os.environ["REPOSITORY"]
          branch = os.environ["BRANCH"]

          # Every file in the repo at this commit, read from the tree (no downloads)
          out = subprocess.run(
              ["git", "ls-tree", "-r", "-z", "--name-only", "HEAD"],
              capture_output=True,
              check=True,
          ).stdout

          zips = [
              p.decode("utf-8")
              for p in out.split(b"\0")
              if p and p.lower().endswith(b".zip")
          ]

          # Group:  Hero (top folder)  ->  Skin set (sub folder)  ->  files
          heroes = {}
          for path in zips:
              parts = PurePosixPath(path).parts
              hero = parts[0] if len(parts) > 1 else "[ROOT]"
              sub = "/".join(parts[1:-1]) or "main folder"
              heroes.setdefault(hero, {}).setdefault(sub, []).append(path)

          # Direct download links (no redirect)
          base = (
              f"https://raw.githubusercontent.com/"
              f"{repository}/{quote(branch, safe='/')}/"
          )

          W = 70
          bar = "=" * W
          thin = "-" * W
          total = len(zips)
          folders = sum(len(s) for s in heroes.values())
          key = str.casefold

          L = [
              bar,
              "ZIP DOWNLOAD CATALOG".center(W),
              bar,
              "",
              f"Repository    : {repository}",
              f"Branch        : {branch}",
              f"Total ZIPs    : {total}",
              f"Total heroes  : {len(heroes)}",
              f"Total folders : {folders}",
              "",
          ]

          if not total:
              L += ["No ZIP files were found.", ""]

          # Index
          if total:
              L += [bar, "INDEX".center(W), bar, ""]
              for hero in sorted(heroes, key=key):
                  n = sum(len(f) for f in heroes[hero].values())
                  L.append(f"  {hero} ".ljust(W - 8, ".") + f" {n:>5}")
              L.append("")

          # One section per hero
          for hero in sorted(heroes, key=key):
              subs = heroes[hero]
              n = sum(len(f) for f in subs.values())
              L += [bar, f"{hero.upper()}  ({n} ZIP{'s' if n != 1 else ''})", bar, ""]

              for sub in sorted(subs, key=key):
                  files = sorted(subs[sub], key=key)
                  L += [
                      f"  [{sub}]  ({len(files)})",
                      "  " + thin[:-2],
                  ]
                  for i, path in enumerate(files, start=1):
                      name = PurePosixPath(path).name
                      L += [
                          f"  {i:02d}. {name}",
                          f"      {base}{quote(path, safe='/')}",
                          "",
                      ]

          L += [bar, "END OF CATALOG".center(W), bar]

          with open("zip-links.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(L) + "\n")

          print(f"Found {total} ZIPs across {len(heroes)} heroes / {folders} folders.")
          PY

      # Commits are authored by whoever pushed (you), not by the bot
      - name: Commit catalog
        env:
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          git config user.name "$ACTOR"
          git config user.email "${ACTOR_ID}+${ACTOR}@users.noreply.github.com"

          git add zip-links.txt

          if git diff --cached --quiet; then
            echo "Catalog is already up to date."
            exit 0
          fi

          git commit -m "chore: update organized ZIP catalog"
          git push origin "HEAD:${GITHUB_REF_NAME}"
